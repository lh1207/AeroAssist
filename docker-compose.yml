services:
  aeroassist:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeroassist-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AeroAssist;User Id=sa;Password=${SA_PASSWORD:-AeroAssist123!};TrustServerCertificate=True
      - Database__AutoMigrate=true
      - Swagger__Enabled=true
      - ReverseProxy__Enabled=true
      - HttpClient__BaseAddress=http://aeroassist:8080/
      - HttpClient__AllowInsecureCertificates=true
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - aeroassist-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aeroassist-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-AeroAssist123!}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - aeroassist-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  aeroassist-network:
    driver: bridge

volumes:
  sqlserver-data:
